<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 565" width="485" height="565">
  <defs>
    <clipPath id="hexClip">
      <polygon points="242.5,7.5 480.66,145 480.66,420 242.5,557.5 4.34,420 4.34,145"/>
    </clipPath>
  </defs>

  <!-- hex fill -->
  <polygon points="242.5,7.5 480.66,145 480.66,420 242.5,557.5 4.34,420 4.34,145" fill="#0D1B2A"/>

  <!-- content clipped to hex -->
  <g clip-path="url(#hexClip)">

    <!-- trajectory spine -->
    <path d="M 62,205 C 110,165 200,200 232,196 S 370,162 410,182" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- connector to gauge -->
    <path d="M 410,182 Q 420,290 242.5,300.0" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="6,5"/>

    <!-- trajectory dots -->
    <circle cx="62" cy="205" r="22" fill="#440154"/>
    <circle cx="148" cy="182" r="17" fill="#3B528B"/>
    <circle cx="232" cy="196" r="14" fill="#21908C"/>
    <circle cx="326" cy="174" r="11" fill="#5DC863"/>
    <circle cx="410" cy="182" r="8" fill="#FDE725"/>

    <!-- arrow -->
    <line x1="410" y1="182" x2="394" y2="169" stroke="rgba(255,255,255,0.65)" stroke-width="3" stroke-linecap="round"/>
    <line x1="410" y1="182" x2="394" y2="195" stroke="rgba(255,255,255,0.65)" stroke-width="3" stroke-linecap="round"/>

    <!-- gauge track (full 180°, navy) -->
    <path d="M 172.50,385.00 A 70,70 0 0 0 312.50,385.00" fill="none" stroke="#1E3A5F" stroke-width="30" stroke-linecap="butt"/>

    <!-- gauge score zone (orange, 0°→72°) -->
    <path d="M 312.50,385.00 A 70,70 0 0 0 264.13,318.43" fill="none" stroke="#FF6B00" stroke-width="30" stroke-linecap="butt"/>

    <!-- zone separator -->
    <line x1="259.5" y1="332.7" x2="268.8" y2="304.2" stroke="#0D1B2A" stroke-width="2.5"/>

    <!-- tick marks -->
    <line x1="297.5" y1="385.0" x2="287.5" y2="385.0" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="287.0" y1="352.7" x2="278.9" y2="358.5" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="259.5" y1="332.7" x2="256.4" y2="342.2" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="225.5" y1="332.7" x2="228.6" y2="342.2" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="198.0" y1="352.7" x2="206.1" y2="358.5" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="187.5" y1="385.0" x2="197.5" y2="385.0" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- needle -->
    <line x1="242.5" y1="385.0" x2="285.4" y2="360.2" stroke="#FF6B00" stroke-width="6" stroke-linecap="round"/>

    <!-- center cap -->
    <circle cx="242.5" cy="385.0" r="11" fill="#FFFFFF"/>
    <circle cx="242.5" cy="385.0" r="5"  fill="#0D1B2A"/>

  </g>

  <!-- hex border (on top for crisp edge) -->
  <polygon points="242.5,7.5 480.66,145 480.66,420 242.5,557.5 4.34,420 4.34,145" fill="none" stroke="#FF6B00" stroke-width="13" stroke-linejoin="round"/>

  <!-- package name -->
  <text x="242.5" y="505"
        text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-weight="700" font-size="60"
        fill="#FFFFFF" letter-spacing="1">BioTrajX</text>

</svg>
